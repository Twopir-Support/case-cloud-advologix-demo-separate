<template>
    <lightning-card title="Focus Matters" icon-name="custom:custom18">
        <div slot="actions"><lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" onclick={load}></lightning-button-icon></div>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={error}><p class="slds-text-color_error">{error}</p></template>
            <template lwc:if={empty}><p class="slds-text-color_weak">You have no focus matters. Open a matter and use Add to Focus Matters.</p></template>
            <template lwc:if={rows.length}>
                <lightning-datatable key-field="matterId" data={rows} columns={columns} hide-checkbox-column></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
